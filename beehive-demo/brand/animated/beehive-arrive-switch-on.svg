<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -40 456 160" role="img" aria-label="beehive"><title>beehive</title><style>.wl{transform-box:view-box;transform-origin:23px 26px}.wr{transform-box:view-box;transform-origin:41px 26px}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s 3s infinite}
.bod{transform-box:fill-box;transform-origin:50% 100%}
.l{transform-box:fill-box;transform-origin:50% 100%}
@keyframes flapL{to{transform:rotate(-26deg)}}@keyframes flapR{to{transform:rotate(26deg)}}
@keyframes burstL{0%,22%,100%{transform:none}3%,9%,15%{transform:rotate(-24deg)}6%,12%,18%{transform:none}}
@keyframes burstR{0%,22%,100%{transform:none}3%,9%,15%{transform:rotate(24deg)}6%,12%,18%{transform:none}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes land{0%,100%{transform:none}35%{transform:scale(1.1,.86)}70%{transform:scale(.96,1.05)}}
.trail{animation:fadeT .6s ease-out var(--tf) both}@keyframes fadeT{to{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.wl{animation:flapL .07s linear 0s 34 alternate,burstL 4s 4.0s infinite}.wr{animation:flapR .07s linear 0s 34 alternate,burstR 4s 4.0s infinite}
.bod{animation:land .45s ease-out 2.35s both}
.idle{animation:float 3s ease-in-out 3.4s infinite}
.trail{--tf:2.6s}
.sc{transform-box:fill-box;transform-origin:center;animation:zm 2.4s ease-in both}@keyframes zm{from{transform:scale(.25)}}.l{animation:on .9s linear both}@keyframes on{0%{opacity:0}10%{opacity:1}18%{opacity:.15}26%{opacity:1}34%{opacity:.4}42%,100%{opacity:1}}.glow{opacity:0;animation:gl 1.6s ease-out 2.6s both}@keyframes gl{0%{opacity:0}40%{opacity:.9}100%{opacity:0}}</style>
